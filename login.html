<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Sign In · Stacks</title>
    <link rel="stylesheet" href="css/globals.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css"/>
<!--    <script src="../js/auth.js"></script> TODO: Add functionality -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" defer></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script src="js/app.js" defer></script>
    <script src="js/interactions.js" defer></script>
</head>
<body class="flow-page">

<header class="flow-header">
    <a class="brand" href="index.html">Stacks</a>
    <div class="header-banner hatch" aria-hidden="true"><span class="text-wrapper">Stacks - Sign In</span></div>
</header>

<main class="flow-main">
    <section class="login-card" aria-labelledby="login-heading">
        <h1 id="login-heading">Sign in to Stacks</h1>

        <p id="login-notice" class="login-notice" role="status" hidden></p>

        <!-- Shown by js/auth.js instead of the form when someone is already signed in -->
        <div id="login-signedin" class="login-signedin" hidden>
            <p>You are signed in as <strong id="signedin-name"></strong>.</p>
            <a class="pill-btn teal" href="index.html">Continue to Stacks</a>
            <a class="sign-out pill-btn outline" href="login.html">Sign out</a>
        </div>

        <!-- Handled locally by js/auth.js. When a backend exists, point action/method at it. -->
        <form id="login-form" action="index.html" method="post" novalidate>
            <div class="login-field">
                <label for="login-username">Username</label>
                <input class="login-input" id="login-username" name="username" type="text"
                       autocomplete="username" aria-describedby="login-error" required />
            </div>
            <div class="login-field">
                <label for="login-password">Password</label>
                <input class="login-input" id="login-password" name="password" type="password"
                       autocomplete="current-password" aria-describedby="login-error" required />
            </div>

            <p id="login-error" class="login-error" role="alert" hidden></p>

            <button class="login-submit pill-btn teal" type="submit">Sign in</button>
        </form>
    </section>
</main>

<footer class="flow-footer">
    <a class="footer-help pill-btn outline" href="help.html#help-login">Help?</a>
    <div class="footer-theme-group">
        <button class="theme-btn theme-dark" type="button" aria-label="Switch to dark mode" aria-pressed="true">⏾</button>
        <button class="theme-btn theme-light" type="button" aria-label="Switch to light mode" aria-pressed="false">☼</button>
    </div>
    <div class="footer-logo">
        <img src="img/logo.png" alt="AppName logo" style="width:100%;height:100%;object-fit:contain;" />
    </div>
</footer>

</body>
</html>
